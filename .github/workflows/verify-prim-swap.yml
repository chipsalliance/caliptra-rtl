# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

# Validates the CALIPTRA_PRIM_ROOT/CALIPTRA_PRIM_MODULE_PREFIX technology-cell
# swap mechanism (for both caliptra_prim and, when `CALIPTRA is defined,
# Adams Bridge's abr_prim automatic reuse of the same prefix) by elaborating
# caliptra_top_tb against a checked-in fake tech-cell directory
# (tools/ci/fake_prim/rtl) instead of the generic implementation. This is a
# build-only check (no simulation run) -- a clean elaboration with no
# missing-file or unknown-module errors proves the override is correctly
# honored and the abr_prim/caliptra_prim port wiring at the swap boundary is
# correct.
#
# Deliberately standalone: this does NOT go through pull_request.yml's
# pre_run/hash_check gate, so it runs on every push/PR regardless of the
# internal sign-off hash check.
name: Verify Primitive Tech-Cell Swap

on:
  pull_request:
  push:
    branches: ["main", "dev-goog", "dev-msft"]
  workflow_dispatch:

env:
  RISCV_VERSION: v12.1.0
  VERILATOR_VERSION: v5.044
  CUSTOM_CACHE_BUSTER: ce6ba052de27

jobs:
  verify_prim_swap:
    name: Build caliptra_top_tb with fake tech-cell primitives
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Restore verilator dir
        uses: actions/cache/restore@v3
        id: verilator_restore
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ env.CUSTOM_CACHE_BUSTER }}

      - name: Install verilator
        if: steps.verilator_restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            git help2man perl python3 make autoconf g++ flex bison ccache \
            numactl perl-doc libfl2 libfl-dev \
            zlib1g zlib1g-dev

          cd /tmp
          git clone https://github.com/verilator/verilator
          cd verilator
          git checkout "${VERILATOR_VERSION}"

          autoconf
          ./configure --prefix=/opt/verilator CXX="ccache g++"
          make -j6
          sudo make install

      - name: Save verilator dir
        uses: actions/cache/save@v3
        if: steps.verilator_restore.outputs.cache-hit != 'true'
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ env.CUSTOM_CACHE_BUSTER }}

      - name: Restore RISC-V Toolchain
        uses: actions/cache/restore@v3
        id: riscv_restore
        with:
          path: /opt/riscv
          key: riscv-${{ env.RISCV_VERSION }}-${{ env.CUSTOM_CACHE_BUSTER }}

      - name: Install RISC-V Toolchain
        if: steps.riscv_restore.outputs.cache-hit != 'true'
        run: |
          wget -O toolchain.tar.gz \
            https://github.com/chipsalliance/caliptra-tools/releases/download/gcc-v12.1.0/riscv64-unknown-elf.gcc-12.1.0.tar.gz
          tar -xzf toolchain.tar.gz -C /opt

      - name: Save riscv dir
        uses: actions/cache/save@v3
        if: steps.riscv_restore.outputs.cache-hit != 'true'
        with:
          path: /opt/riscv
          key: riscv-${{ env.RISCV_VERSION }}-${{ env.CUSTOM_CACHE_BUSTER }}

      - name: Install ccache
        run: |
          sudo apt-get install -y git ccache

      - name: Setup paths
        run: |
          echo /opt/verilator/bin >> $GITHUB_PATH
          echo /opt/riscv/bin >> $GITHUB_PATH

      - name: Build caliptra_top_tb against fake tech-cell primitives
        run: |
          # Don't rely on the default shell's pipefail behavior -- set it
          # explicitly so `make | tee` can't silently swallow a `make`
          # failure behind tee's own (near-always-successful) exit code.
          set -euo pipefail

          CALIPTRA_ROOT=$(pwd)
          ADAMSBRIDGE_ROOT=$CALIPTRA_ROOT/submodules/adams-bridge
          export CALIPTRA_AXI4PC_DIR=$CALIPTRA_ROOT/src/integration/tb

          # Point BOTH env vars at the checked-in fake tech-cell directory,
          # using a module-name prefix distinct from the generic default so
          # a mismatched/stale resolution can't accidentally still find the
          # right module by coincidence.
          export CALIPTRA_PRIM_ROOT=$CALIPTRA_ROOT/tools/ci/fake_prim
          export CALIPTRA_PRIM_MODULE_PREFIX=faketech_prim

          cd tools/scripts
          make verilator-build \
            CALIPTRA_ROOT=$CALIPTRA_ROOT \
            ADAMSBRIDGE_ROOT=$ADAMSBRIDGE_ROOT \
            CALIPTRA_PRIM_ROOT=$CALIPTRA_PRIM_ROOT \
            CALIPTRA_PRIM_MODULE_PREFIX=$CALIPTRA_PRIM_MODULE_PREFIX \
            2>&1 | tee verilator_build.log

          # Defense in depth: explicitly verify the Makefile recipe's
          # completion marker (its final `touch verilator-build` step) is
          # present, independent of `set -euo pipefail` above, in case any
          # future refactor of this step reintroduces a swallowed exit code.
          if [[ ! -f verilator-build ]]; then
            echo "ERROR: verilator-build completion marker not found -- build did not complete successfully"
            exit 1
          fi
          echo "verilator-build completed successfully (completion marker present)"
