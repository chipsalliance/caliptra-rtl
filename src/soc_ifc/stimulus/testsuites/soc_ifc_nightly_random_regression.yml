document:
  schema: 1.0

contents:
  - generator:
      tags: ["L1", "SOC_IFC",  "random"]
      path: ""
      config:
        params:
          # 12 hours to accommodate certain longer-running tests
          timeout: 720
      weight: 100
      generations: 500
      formats: 
        generate: "reseed {template}.yml -seed {seed}"
        path: "{template_basename}__{seed}.yml"
      templates:
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_rand_test   : { weight 95 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_trng_test   : { weight  5 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_dma_transfer_stress_test   : { weight  5 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_dma_soc_access_stress_test : { weight  5 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_dma_long_transfer_long_b_resp_short_r_resp_test : { weight  5 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_dma_long_transfer_long_r_resp_short_b_resp_test : { weight  5 }
        $CALIPTRA_ROOT/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/project_benches/soc_ifc/tb/tests/src/soc_ifc_sha_acc_axi_user_test: { weight  5 }
