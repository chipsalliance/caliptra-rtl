---
# Runtime-bounded transfer stress: all five routes, random sizes and response
# delays, plus one maximum delayed-write-response pressure scenario.
seed: ${PLAYBOOK_RANDOM_SEED}
plusargs:
- '+UVM_TESTNAME=soc_ifc_cmdline_test'
- '+CLP_SEQ=soc_ifc_env_dma_transfer_stress_sequence'
- '+UVM_VERBOSITY=UVM_LOW'
testname: soc_ifc_dma_transfer_stress_test
