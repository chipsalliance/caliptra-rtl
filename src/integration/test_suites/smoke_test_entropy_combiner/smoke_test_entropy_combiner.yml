---
seed: 1
testname: smoke_test_entropy_combiner
description: |
  Smoke test for the dual-iTRNG SHA3-384 entropy_combiner in combine mode.
  Enables both entropy_src blocks (ES0/ES1), runs the real
  physical_rng x2 -> entropy_src -> entropy_combiner -> CSRNG datapath, and
  checks CSRNG's 128-bit genbits against the golden SHA3-384(IS0 || IS1) seed.
  +CLP_ITRNG1_EN sets the dual_iTRNG_en strap (combine mode); the two physical
  RNG sources use distinct InitialSeeds so combine mode is meaningfully tested.
  +CLP_SECOND_RNG_DELAY pins the secondary source arrival for a reproducible run
  (genbits are deterministic regardless of the delay value).
plusargs:
  - +CLP_ITRNG1_EN
  - +CLP_SECOND_RNG_DELAY=7
