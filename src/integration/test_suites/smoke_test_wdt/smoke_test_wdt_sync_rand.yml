#
# smoke_test_wdt with randomized synchronizer latency (rvsyncss simulation
# model, +RV_SYNC_RAND_DELAY) and DCLS detection enabled. Exercises the
# watchdog NMI and the warm reset that follows it; main and shadow core must
# not diverge. Subsystem mode only (+CLP_DCLS_EN has no effect in passive mode).
---
seed: 1
testname: smoke_test_wdt
plusargs:
  - +RV_SYNC_RAND_DELAY
  - +CLP_DCLS_EN
