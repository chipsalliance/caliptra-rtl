---
seed: 1
testname: smoke_test_entropy_src
description: |
  entropy_src smoke test in boot-time and FIPS mode, with 4-bit symbols and in
  single-lane mode. The seeds are routed to firmware and compared against
  src/entropy_src/tb/entropy_src_model.py. The health test thresholds are
  configured as described in the integration specification.
plusargs:
  - +CLP_DETERMINISTIC_RNG
