---
seed: 1
testname: smoke_test_entropy_combiner_multiseed
description: |
  Back-to-back multi-seed dual-iTRNG combine test (Plan E). Both entropy_src
  blocks run their SHA3-384 conditioners (FIPS mode); CSRNG pulls 4 consecutive
  combined seeds (startup then steady-state) via uninstantiate/re-instantiate and
  checks each 128-bit genbits against a golden from tb/es_conditioner_model.py.
  Exercises the combiner FSM re-request path and ES steady-state seed production.
  Requires the subsystem build (caliptra_top_ss_mode_tb) with the deterministic RNG.
plusargs:
  - +CLP_ITRNG1_EN
  - +CLP_DETERMINISTIC_RNG
  - +CLP_SECOND_RNG_DELAY=7
