---
seed: 1
testname: smoke_test_entropy_combiner_conditioned
description: |
  Conditioner-enabled (FIPS mode) dual-iTRNG combine test. Both entropy_src blocks
  run their SHA3-384 conditioners; the combiner hashes SHA3-384(ES0_cond||ES1_cond)
  and CSRNG genbits are checked against a golden generated offline by
  tb/es_conditioner_model.py with FIPS_WINDOW=1024. Uses the deterministic RNG
  (+CLP_DETERMINISTIC_RNG) so the conditioned output is reproducible. Requires the
  subsystem build (caliptra_top_ss_mode_tb).
plusargs:
  - +CLP_ITRNG1_EN
  - +CLP_DETERMINISTIC_RNG
  - +CLP_SECOND_RNG_DELAY=7
